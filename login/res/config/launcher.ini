; =====================================================================
;  dnf_launcher_cli configuration file
;  Usage: copy this file next to dnf_launcher_cli.exe, edit it, run it.
;         No recompilation is required.
;
;  Encoding: ANSI or UTF-8 (without BOM). Key names are case-insensitive,
;            unknown keys are ignored.
;  Note: do NOT wrap values in quotes; comments must occupy their own line
;        and cannot be placed after a value.
; =====================================================================

[Database]
; Database host
Host=192.168.200.131

; Port, a plain number in 1-65535
Port=3306

; Database account
User=game

; Database password. To use none, keep the line and leave it empty: Password=
Password=uu5!^%jg

; Address handed to the game client. Only change this when it differs from Host above.
ServerIP=192.168.200.131
